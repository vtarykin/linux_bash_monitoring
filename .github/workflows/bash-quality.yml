name: Bash Quality Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bats shellcheck python3

      - name: Check Bash syntax
        run: |
          for file in bin/*.sh lib/*.sh; do
            bash -n "$file"
          done

      - name: Run ShellCheck
        run: shellcheck -x bin/*.sh

      - name: Run automated tests
        run: bats tests/
